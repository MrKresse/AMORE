name: amore
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # core scientific stack
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - h5py>=3.8
  - pandas>=2.0
  - tqdm>=4.65
  - scikit-learn>=1.3
  - networkx>=3.1
  # molecular dynamics / structure
  - mdtraj>=1.9
  - MDAnalysis>=2.7
  # single-cell (scanpy pulls anndata, umap-learn, etc.)
  - scanpy>=1.9
  - anndata>=0.10
  - leidenalg                # scanpy community detection
  - python-igraph            # scanpy dependency
  # pytorch from the pytorch channel — consistent Intel OpenMP, no CUDA DLLs
  # AMD GPU note: torch-directml requires pip torch 2.4.1 which conflicts with this.
  # For AMD GPU: create a separate env with `pip install torch==2.4.1 torch-directml`.
  # Tested 33x matmul speedup, but forward-pass overhead dominates for 40-dim PCA input.
  # Only beneficial for HVG (2000-dim) or larger architectures.
  - pytorch
  - cpuonly
  - pip
  - pip:
    - cospar                 # LARRY dataset + CoSpar baseline
    - scikit-learn-extra     # MoKiTo dependency (k-medoids etc.)
    # local editable installs — run after env creation:
    #   pip install -e C:\Users\kr3ss\Desktop\ZIBwork\AMORE
    #   pip install -e C:\Users\kr3ss\Desktop\ZIBwork\MoKiTo\MoKiTo
    #   MoKiTo path also added to site-packages via zibwork.pth