[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "amore"
version = "0.1.0"
description = "Analysis tools for ISOKANN: features, chi sensitivity, and structure I/O"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "MDAnalysis",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]
